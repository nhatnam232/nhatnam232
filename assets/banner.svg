<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="JADES banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#131833"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="0.5" stop-color="#7C8DFF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C8DFF"/>
      <stop offset="1" stop-color="#7C8DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="16" fill="url(#bg)"/>

  <g fill="#7C8DFF">
    <circle cx="120" cy="52" r="2.5" opacity=".35"><animate attributeName="opacity" values=".15;.5;.15" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="150" r="1.8" opacity=".3"/>
    <circle cx="186" cy="200" r="2" opacity=".25"><animate attributeName="opacity" values=".25;.6;.25" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="60" r="2.2" opacity=".3"><animate attributeName="opacity" values=".3;.65;.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="806" cy="160" r="1.8" opacity=".35"/>
    <circle cx="620" cy="36" r="1.5" opacity=".2"/>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace">
    <text x="46" y="176" font-size="30" font-weight="600" fill="#5865F2" opacity=".5">&lt;/&gt;</text>
    <text x="120" y="88" font-size="22" fill="#00C2A8" opacity=".55">{ }</text>
    <text x="742" y="110" font-size="24" fill="#5865F2" opacity=".5">()=&gt;</text>
    <text x="672" y="216" font-size="22" fill="#00C2A8" opacity=".5">;</text>
  </g>

  <text x="440" y="126" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-weight="800" font-size="72" letter-spacing="14" fill="url(#txt)">JADES</text>

  <line x1="250" y1="152" x2="630" y2="152" stroke="url(#line)" stroke-width="2"/>

  <text x="440" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" letter-spacing="6" fill="#9aa4b2">FULL-STACK DEVELOPER · TYPESCRIPT FIRST</text>
  <text x="440" y="214" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" letter-spacing="3" fill="#6e7681">SELF-TAUGHT · SHIPPING FROM VIETNAM 🇻🇳</text>
